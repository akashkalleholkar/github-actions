name: Dev Build Apply Deploy

on:
  push:
    branches:
      - devd

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build step
        run: echo "🔨 Building application..."

  apply:
    name: Apply
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Apply changes
        run: echo "📦 Applying infrastructure / config..."

  deploy:
    name: Deploy (Approval Required)
    needs: apply
    runs-on: ubuntu-latest
    environment: dev   # 👈 approval comes from here
    steps:
      - name: Deploy application
        run: echo "🚀 Deploying to DEV environment..."
