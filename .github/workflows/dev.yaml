name: Echo on Push

on:
  push:
    branches:
      - prod

jobs:
  prod:
    uses: akashkalleholkar/githubworkflows/.github/workflows/pipeline.yml@main

    with:
      pullimage: true
      tagimage: true
      pushimage: true

    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
